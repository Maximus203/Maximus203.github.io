name: Build and Deploy via cPanel API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: cpanel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: Unit and contract tests
        run: npm run test:unit

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Verify static export
        run: npm run build
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_ASSET_PREFIX: https://maximus203.github.io
          NEXT_PUBLIC_ASSET_ORIGIN: https://maximus203.github.io

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-actions
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build project
        run: npm run build
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_ASSET_PREFIX: https://maximus203.github.io
          NEXT_PUBLIC_ASSET_ORIGIN: https://maximus203.github.io

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp -a out/. deploy/
          cp public/.htaccess deploy/ 2>/dev/null || true
          node --import tsx scripts/deploy-cpanel.ts marker
          tar -czf site.tar.gz -C deploy .

      - name: Deploy via cPanel API and verify primary domain
        run: node --import tsx scripts/deploy-cpanel.ts
        env:
          CPANEL_USER: ${{ secrets.LOGIN }}
          CPANEL_TOKEN: ${{ secrets.TOKEN }}
          CPANEL_SERVER: ${{ secrets.SERVER }}
