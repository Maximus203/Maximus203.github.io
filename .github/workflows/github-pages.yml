name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: Unit and contract tests
        run: npm run test:unit

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Verify static export
        run: npm run build
        env:
          NEXT_OUTPUT: export


      - name: Install browser for application checks
        run: npx playwright install --with-deps chromium

      - name: Browser application checks against fresh static export
        run: |
          python3 -m http.server 4178 --directory out --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4178/en/applications/ > /dev/null && break
            sleep 1
          done
          npm run test:applications
        env:
          PORTFOLIO_BASE_URL: http://127.0.0.1:4178

      - name: Upload application test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-qa
          path: artifacts/
          if-no-files-found: ignore

  build:
    name: Build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-actions
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_ASSET_PREFIX: https://maximus203.github.io
          NEXT_PUBLIC_ASSET_ORIGIN: https://maximus203.github.io

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
